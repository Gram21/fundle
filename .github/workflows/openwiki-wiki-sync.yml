name: OpenWiki Wiki Sync

# Keeps the GitHub wiki mirrored 1:1 with the openwiki/ folder, in both directions:
#   - push to main touching openwiki/**  -> mirror those files into the wiki repo
#   - wiki page edited (gollum event)    -> mirror the wiki repo back into openwiki/ and commit to main
#
# index.md <-> Home.md at the wiki root, since GitHub wikis require a Home page.
# Everything else keeps its path (GitHub wiki repos support subdirectories).

on:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
  gollum:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repo-to-wiki:
    if: github.event_name != 'gollum'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo

      - name: Check out wiki
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror openwiki/ into wiki
        run: |
          rsync -a --delete --exclude '.git' repo/openwiki/ wiki/
          mv wiki/index.md wiki/Home.md

      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes."
            exit 0
          fi
          git commit -m "Sync wiki from openwiki/ (${{ github.sha }})"
          git push

  wiki-to-repo:
    if: github.event_name == 'gollum'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo

      - name: Check out wiki
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Mirror wiki into openwiki/
        run: |
          rsync -a --delete --exclude '.git' wiki/ repo/openwiki/
          mv repo/openwiki/Home.md repo/openwiki/index.md

      - name: Commit and push repository
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki
          if git diff --cached --quiet; then
            echo "No openwiki changes."
            exit 0
          fi
          git commit -m "docs: sync openwiki/ from wiki edit"
          git push
